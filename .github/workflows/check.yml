name: Check
on: pull_request

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # Every PR needs a changeset (use `npx changeset --empty` for changes that don't ship).
      # Skipped on the Version Packages PR, which consumes the changesets by design.
      - if: github.head_ref != 'changeset-release/main'
        run: npx changeset status --since=origin/main
